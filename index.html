// =====================================================
// MASUK KE SIPKAR SETELAH LOGIN
// =====================================================

function masukKeSIPKAR() {

  document.getElementById("halamanLogin")
    .style.display = "none";

  document.getElementById("bagianScanner")
    .style.display = "block";

  dataSiswa.style.display = "none";

  formPoin.style.display = "none";


  const infoPengguna =
    document.getElementById("infoPengguna");


  infoPengguna.innerHTML =
    "👨‍🏫 Login sebagai: <b>" +
    penggunaAktif.nama +
    "</b> " +
    '<button class="btn-logout" onclick="logout()">Keluar</button>';


  // ===============================
  // MULAI KAMERA SETELAH LOGIN
  // ===============================
  mulaiScanner();

}

    
// =====================================================
// LOGOUT
// =====================================================

function logout() {

  if (!confirm("Apakah Anda yakin ingin keluar?")) {
    return;
  }


  // Hentikan kamera jika sedang aktif
  try {

    html5QrCode.stop();

  } catch (error) {

    console.log(error);

  }


  localStorage.removeItem(
    "sipkar_pengguna"
  );


  penggunaAktif = null;

  location.reload();

}
    
// =====================================================
// CEK LOGIN SAAT HALAMAN DIBUKA
// =====================================================

function cekLogin() {

  const data =
    localStorage.getItem(
      "sipkar_pengguna"
    );


  if (!data) {

    document.getElementById("halamanLogin")
      .style.display = "block";

    document.getElementById("bagianScanner")
      .style.display = "none";

    dataSiswa.style.display = "none";

    formPoin.style.display = "none";

    return;
  }


  try {

    penggunaAktif =
      JSON.parse(data);


    if (
      !penggunaAktif.idUser ||
      !penggunaAktif.username
    ) {

      throw new Error(
        "Data login tidak lengkap."
      );

    }


    masukKeSIPKAR();

  } catch (error) {

    console.error(error);

    localStorage.removeItem(
      "sipkar_pengguna"
    );

    location.reload();

  }

}


// ===============================
// CEK LOGOUT DARI URL
// ===============================
function prosesLogoutDariURL() {
  const parameterURL = new URLSearchParams(window.location.search);

  if (parameterURL.get("logout") === "1") {
    // Hapus sesi login
    localStorage.removeItem("sipkar_pengguna");
    penggunaAktif = null;

    // Bersihkan URL
    history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    // Tampilkan halaman login
    document.getElementById("halamanLogin").style.display = "block";
    document.getElementById("bagianScanner").style.display = "none";
    document.getElementById("dataSiswa").style.display = "none";
    document.getElementById("formPoin").style.display = "none";

    return true;
  }

  return false;
}


// ===============================
// JALANKAN APLIKASI
// ===============================
if (!prosesLogoutDariURL()) {
  cekLogin();
}

<script>


  // =====================================================
  // URL WEB APP APPS SCRIPT
  // =====================================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/a/macros/guru.sd.belajar.id/s/AKfycbwzXoGGI6P1aRvAVVVVfvF6lHmTPgyk8gsjMl1irmWdCqsVY7FkcIL5wBRD1xXU3lOk/exec";

  
// =====================================================
// LOGIN GURU
// =====================================================

function login() {

  const username =
    document.getElementById("usernameLogin").value.trim();

  const password =
    document.getElementById("passwordLogin").value;

  const pesanLogin =
    document.getElementById("pesanLogin");

  const btnLogin =
    document.getElementById("btnLogin");


  if (!username || !password) {

    pesanLogin.innerText =
      "Username dan password wajib diisi.";

    return;
  }


  btnLogin.disabled = true;

  btnLogin.innerText =
    "⏳ Memeriksa...";

  pesanLogin.innerText =
    "";


  const namaCallback =
    "callbackLogin_" + Date.now();


  window[namaCallback] =
    function(hasil) {

      delete window[namaCallback];


      if (!hasil.berhasil) {

        pesanLogin.innerText =
          "❌ " + hasil.pesan;

        btnLogin.disabled = false;

        btnLogin.innerText =
          "🔐 MASUK";

        return;
      }


      // Simpan identitas pengguna
      penggunaAktif = {

        idUser: hasil.idUser,

        nama: hasil.nama,

        username: hasil.username,

        role: hasil.role

      };


      localStorage.setItem(
        "sipkar_pengguna",
        JSON.stringify(penggunaAktif)
      );


      masukKeSIPKAR();

    };


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=login" +
    "&username=" +
    encodeURIComponent(username) +
    "&password=" +
    encodeURIComponent(password) +
    "&callback=" +
    namaCallback +
    "&_=" +
    Date.now();


  script.onerror =
    function() {

      delete window[namaCallback];

      pesanLogin.innerText =
        "❌ Tidak dapat menghubungi server.";

      btnLogin.disabled = false;

      btnLogin.innerText =
        "🔐 MASUK";

    };


  document.body.appendChild(script);

}
  
  // =====================================================
  // DATA SEMENTARA
  // =====================================================

  let siswaAktif = null;

  let penggunaAktif = null

  // =====================================================
// MULAI SCANNER QR
// =====================================================

function mulaiScanner() {

  const reader = document.getElementById("reader");

  if (!reader) {
    console.error("Elemen reader tidak ditemukan.");
    return;
  }

  reader.innerHTML = "";

  const scanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      },
      rememberLastUsedCamera: true,
      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]
    },
    false
  );

  scanner.render(
    qrBerhasil,
    function(error) {
      // Abaikan error pembacaan QR sementara
    }
  );
}

  let semuaPoin = [];

  let jenisAktif = "";


  // =====================================================
  // ELEMENT
  // =====================================================

  const pesan =
    document.getElementById("pesan");

  const bagianScanner =
    document.getElementById("bagianScanner");

  const dataSiswa =
    document.getElementById("dataSiswa");

  const formPoin =
    document.getElementById("formPoin");

  const kategori =
    document.getElementById("kategori");

  const poinSelect =
    document.getElementById("poinSelect");

  const nilai =
    document.getElementById("nilai");

  const btnSimpan =
    document.getElementById("btnSimpan");


  // =====================================================
  // QR BERHASIL DIBACA
  // =====================================================

  function qrBerhasil(qrText) {

    console.log("QR terbaca:", qrText);

    pesan.innerText =
      "QR terbaca: " + qrText;

    ambilDataSiswa(qrText);

  }


  // =====================================================
  // AMBIL DATA SISWA
  // =====================================================

  function ambilDataSiswa(qrId) {

  pesan.innerText = "Mengambil data siswa...";

  const namaCallback =
    "callbackSiswa_" + Date.now();

  window[namaCallback] = function(siswa) {

    // Hapus callback setelah selesai
    delete window[namaCallback];

    if (!siswa.ditemukan) {

      pesan.innerText =
        "❌ Siswa tidak ditemukan.";

      return;
    }

    siswaAktif = siswa;

    // Tampilkan data siswa
    document.getElementById("nama").innerText =
      siswa.nama;

    document.getElementById("idSiswa").innerText =
      "ID Siswa: " + siswa.idSiswa;

    document.getElementById("kelas").innerText =
      "Kelas: " + siswa.kelas;

    document.getElementById("poin").innerText =
      siswa.poin;

    // Sembunyikan scanner
    bagianScanner.style.display =
      "none";

    // Tampilkan data siswa
    dataSiswa.style.display =
      "block";

    // Tampilkan form poin
    formPoin.style.display =
      "block";

    // Reset form
    resetForm();

  };

  const script =
    document.createElement("script");

  script.src =
    APPS_SCRIPT_URL +
    "?qr=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    namaCallback;

  script.onerror = function() {

    delete window[namaCallback];

    pesan.innerText =
      "❌ Gagal mengambil data siswa.";
  };

  document.body.appendChild(script);

}


  // =====================================================
// PILIH JENIS
// =====================================================

function pilihJenis(jenis) {

  jenisAktif = jenis;

  const btnPositif =
    document.getElementById("btnPositif");

  const btnNegatif =
    document.getElementById("btnNegatif");


  // Reset tombol
  btnPositif.classList.remove(
    "aktif-positif"
  );

  btnNegatif.classList.remove(
    "aktif-negatif"
  );


  // Aktifkan tombol yang dipilih
  if (jenis === "Positif") {

    btnPositif.classList.add(
      "aktif-positif"
    );

  } else {

    btnNegatif.classList.add(
      "aktif-negatif"
    );

  }


  // Tampilkan status memuat
  kategori.innerHTML =
    '<option value="">Memuat kategori...</option>';

  poinSelect.innerHTML =
    '<option value="">Pilih poin</option>';

  nilai.innerText =
    "-";

  btnSimpan.disabled = true;


  // =====================================================
  // CALLBACK JSONP
  // =====================================================

  const namaCallback =
    "callbackPoin_" + Date.now();


  window[namaCallback] =
    function(data) {

      // Hapus callback setelah selesai
      delete window[namaCallback];


      // Simpan semua poin
      semuaPoin = data;


      // Isi kategori
      isiKategori();

    };


  // =====================================================
  // BUAT SCRIPT JSONP
  // =====================================================

  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=poin&jenis=" +
    encodeURIComponent(jenis) +
    "&callback=" +
    namaCallback;


  script.onerror =
    function() {

      delete window[namaCallback];

      kategori.innerHTML =
        '<option value="">Gagal memuat kategori</option>';

      poinSelect.innerHTML =
        '<option value="">Pilih poin</option>';

      nilai.innerText =
        "-";

    };


  document.body.appendChild(script);

}


  // =====================================================
  // ISI KATEGORI
  // =====================================================

  function isiKategori() {

    kategori.innerHTML =
      '<option value="">Pilih kategori</option>';


    const daftarKategori =
      [...new Set(
        semuaPoin.map(
          item => item.kategori
        )
      )];


    daftarKategori.forEach(
      function(namaKategori) {

        const option =
          document.createElement("option");

        option.value =
          namaKategori;

        option.textContent =
          namaKategori;

        kategori.appendChild(option);

      }
    );

  }


  // =====================================================
  // KATEGORI BERUBAH
  // =====================================================

  function kategoriBerubah() {

    const kategoriDipilih =
      kategori.value;


    poinSelect.innerHTML =
      '<option value="">Pilih poin</option>';

    nilai.innerText =
      "-";


    if (!kategoriDipilih) {

      return;

    }


    const daftarPoin =
      semuaPoin.filter(
        function(item) {

          return item.kategori ===
                 kategoriDipilih;

        }
      );


    daftarPoin.forEach(
      function(item) {

        const option =
          document.createElement("option");

        option.value =
          item.idPoin;

        option.textContent =
          item.namaPoin +
          " (" +
          item.nilai +
          ")";

        option.dataset.nilai =
          item.nilai;

        poinSelect.appendChild(option);

      }
    );

  }


  // =====================================================
  // POIN BERUBAH
  // =====================================================

  function poinBerubah() {

    const pilihan =
      poinSelect.options[
        poinSelect.selectedIndex
      ];


    if (!pilihan || !poinSelect.value) {

      nilai.innerText =
        "-";

      btnSimpan.disabled =
        true;

      return;

    }


    nilai.innerText =
      pilihan.dataset.nilai;


    // Untuk tahap ini tombol tetap dinonaktifkan

    btnSimpan.disabled =
  false;

  }


  // =====================================================
  // RESET FORM
  // =====================================================

  function resetForm() {

    jenisAktif = "";

    semuaPoin = [];

    kategori.innerHTML =
      '<option value="">Pilih kategori</option>';

    poinSelect.innerHTML =
      '<option value="">Pilih poin</option>';

    nilai.innerText =
      "-";

    document.getElementById("keterangan").value =
      "";

    document.getElementById(
      "btnPositif"
    ).classList.remove(
      "aktif-positif"
    );

    document.getElementById(
      "btnNegatif"
    ).classList.remove(
      "aktif-negatif"
    );

    btnSimpan.disabled =
      true;

  }


  // =====================================================
  // KEMBALI KE SCANNER
  // =====================================================

  function kembaliScanner() {

    location.reload();

  }


  // =====================================================
  // SIMPAN
  // =====================================================

  // =====================================================
// SIMPAN POIN
// =====================================================

function simpan() {

  // Pastikan ada siswa
  if (!siswaAktif) {

    alert("Data siswa belum tersedia.");

    return;
  }


  // Ambil poin yang dipilih
  const idPoin =
    poinSelect.value;


  if (!idPoin) {

    alert("Silakan pilih poin terlebih dahulu.");

    return;
  }


  // Ambil keterangan
  const keterangan =
    document.getElementById("keterangan").value.trim();


  // Nonaktifkan tombol agar tidak double klik
  btnSimpan.disabled = true;

  btnSimpan.innerText =
    "⏳ Menyimpan...";


  // =====================================================
  // CALLBACK
  // =====================================================

  const namaCallback =
    "callbackSimpan_" + Date.now();


  window[namaCallback] =
    function(hasil) {

      // Hapus callback
      delete window[namaCallback];


      if (!hasil.berhasil) {

        alert(
          "❌ Gagal menyimpan:\n" +
          hasil.pesan
        );

        btnSimpan.disabled = false;

        btnSimpan.innerText =
          "💾 SIMPAN POIN";
        setTimeout(function() {
  location.reload();
}, 1000);

        
        return;
      }


      // =================================================
      // BERHASIL
      // =================================================

      // Setelah server mengonfirmasi berhasil,
      // langsung kembali ke scanner.
      // Tidak ada alert agar alur guru lebih cepat.
      perbaruiDataSiswaSetelahSimpan();

    };


  // =====================================================
  // BUAT REQUEST JSONP
  // =====================================================

  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=simpan" +
    "&idSiswa=" +
    encodeURIComponent(
      siswaAktif.idSiswa
    ) +
    "&idPoin=" +
    encodeURIComponent(
      idPoin
    ) +
    "&idUser=" +
    encodeURIComponent(
    penggunaAktif.idUser
    )
    "&keterangan=" +
    encodeURIComponent(
      keterangan
    ) +
    "&callback=" +
    namaCallback;


  script.onerror =
    function() {

      delete window[namaCallback];

      alert(
        "❌ Terjadi kesalahan saat menghubungi server."
      );

      btnSimpan.disabled = false;

      btnSimpan.innerText =
        "💾 SIMPAN POIN";

    };


  document.body.appendChild(script);

}

// =====================================================
// PERBARUI DATA SISWA SETELAH SIMPAN
// =====================================================

function perbaruiDataSiswaSetelahSimpan() {

  // Setelah transaksi berhasil,
  // langsung kembali ke mode scan

  // Eksekusi langsung setelah server mengonfirmasi sukses.
  // Tidak ada delay 1000 ms agar guru bisa segera scan siswa berikutnya.
  siswaAktif = null;
    semuaPoin = [];
    jenisAktif = "";

    // Bersihkan data siswa
    document.getElementById("nama").innerText = "";
    document.getElementById("idSiswa").innerText = "";
    document.getElementById("kelas").innerText = "";
    document.getElementById("poin").innerText = "";

    // Sembunyikan data siswa
    dataSiswa.style.display = "none";

    // Sembunyikan form
    formPoin.style.display = "none";

    // Tampilkan scanner
    bagianScanner.style.display = "block";

    // Reset form
    resetForm();

    // Pesan
    pesan.innerText =
      "Silakan scan QR siswa berikutnya.";

  // Aktifkan tombol simpan kembali
  btnSimpan.disabled = true;
  btnSimpan.innerText =
    "💾 SIMPAN POIN";

}
  
  // =====================================================
  // START SCANNER
  // =====================================================

  const scanner =
    new Html5QrcodeScanner(

      "reader",

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera: true,

        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]

      },

      false

    );


  scanner.render(

    qrBerhasil,

    function(error) {

      // QR belum terbaca.
      // Tidak perlu menampilkan error.

    }

  );

</script>
